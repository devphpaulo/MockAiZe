name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build portable executable
        shell: pwsh
        run: .\tools\build.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mockaize-windows-portable
          path: app/dist/MockAiZe-*.exe
          if-no-files-found: error
          retention-days: 14
