<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="__CSRF_TOKEN__"><meta name="theme-color" content="#121212"><link rel="icon" type="image/png" href="/assets/mockaize-favicon.png"><link rel="shortcut icon" href="/favicon.ico"><title>MockAíZé — Estúdio XML</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/library.css"><link rel="stylesheet" href="/select.css"><link rel="stylesheet" href="/ui-motion.css"><link rel="stylesheet" href="/editor-components.css"><script src="/select.js" defer></script><script src="/ui-motion.js" defer></script><script src="/date-picker.js" defer></script><script src="/record-pagination.js" defer></script></head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar" aria-label="Workspaces e configurações">
  <div class="brand"><img class="brandmark" src="/assets/mockaize-favicon.png" alt="">MockAíZé</div>
  <div><p class="section-caption">Workspace</p><button class="workspace-select" id="workspaceButton"></button></div>
  <nav><p class="section-caption">Pastas e arquivos</p><div class="config-list" id="configList"></div><button class="ghost" id="newConfig">＋ Organizar biblioteca</button></nav>
  <div class="sidebar-bottom"><button id="backHome" class="ghost" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button><button id="exportPowerShell" type="button" title="Baixar os scripts PowerShell (.ps1) e inicializador (.bat)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span>Baixar scripts</span></button><span class="prototype-badge">Armazenamento local<br>Documentos\MockAíZé</span></div>
  <div id="sidebarResize" class="panel-resize sidebar-resize" role="separator" aria-label="Redimensionar navegação" aria-orientation="vertical" aria-valuemin="192" aria-valuemax="448" tabindex="0"></div>
 </aside>
 <main class="workspace">
  <header class="topbar"><button class="mobile-menu ghost" id="mobileMenu" aria-label="Abrir navegação" aria-expanded="false">☰</button><div class="breadcrumbs" id="breadcrumbs"></div><div class="top-actions"><button class="ghost small" id="themeToggle" aria-label="Alternar tema">Tema: escuro</button><span class="saved-state" id="savedState">✓ Salvo</span><button class="primary small" id="saveConfig">Salvar configuração</button></div></header>
  <section class="page-head" id="pageHead"></section>
  <div class="editor-toolbar" id="editorToolbar"></div>
  <section class="load-error" id="studioLoadError" role="alert" hidden><h2>Não foi possível abrir esta variação</h2><p id="studioLoadErrorMessage"></p><div><button class="primary" id="retryStudio">Tentar novamente</button><a href="/?view=library">Voltar à biblioteca</a></div></section>
  <div class="processing" id="processing" hidden><span id="processingText" role="status">Gerando registros…</span><button class="small" id="cancelGeneration">Cancelar</button></div>
  <div class="mobile-tabs" id="mobileTabs"><button data-mobile-tab="input" class="active">Entrada</button><button data-mobile-tab="output">Saída</button></div>
  <div class="work-area inspector-closed" id="workArea">
   <div class="code-workspace"><div class="code-pair" id="codePair"><section class="xml-panel input-panel" id="inputPanel" aria-label="XML de entrada"></section><div class="connection-gap" id="connectionRail"><div class="connection-tools"><button id="syncScroll" type="button" class="ghost sync-button" aria-label="Sincronizar rolagem dos XMLs" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4"/></svg></button><span id="connectionCount" class="connection-count" aria-label="Quantidade de vínculos">0</span></div></div><section class="xml-panel output-panel" id="outputPanel" aria-label="XML de saída"></section><svg class="connections" id="connections" aria-hidden="true"></svg></div></div>
   <div class="inspector-dock" id="inspectorDock" hidden><div id="inspectorResize" class="panel-resize inspector-resize" role="separator" aria-label="Redimensionar painel de fórmulas" aria-orientation="vertical" aria-valuemin="272" aria-valuemax="720" tabindex="0"></div><aside class="inspector" id="inspector" aria-label="Configurar campo"></aside></div>
  </div>
  <footer class="bottom-bar" id="bottomBar"></footer>
 </main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="modal" aria-labelledby="dialogTitle"></dialog>
<dialog id="inspectorDialog" class="inspector-dialog" aria-label="Configurar fórmulas em modal"><div id="inspectorModalHost"></div></dialog>
<input type="file" id="xmlFileInput" accept=".xml,.txt,application/xml,text/xml" hidden>


<script src="/engine.js" defer></script><script src="/return-combobox.js" defer></script><script src="/return-selection.js" defer></script><script src="/return-models.js" defer></script><script src="/studio-api.js" defer></script><script src="/studio-layout.js" defer></script><script src="/library.js" defer></script><script src="/manual-studio.js" defer></script><script src="/presence-editor.js" defer></script><script src="/filter-studio.js" defer></script><script src="/studio.js" defer></script>
</body></html>
