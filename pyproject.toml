[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockaize"
version = "0.1.13"
description = "Gerador local de mocks XML"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
mockaize = "mockaize.server:serve"

[tool.setuptools.package-data]
mockaize = ["web/*.html", "web/*.js", "web/*.css", "web/assets/*", "assets/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mockaize*"]
